name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend

  ios-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/CatalogueCore

  ios-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the first available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          simulator_json = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          )
          devices = json.loads(simulator_json)["devices"]
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(f"udid={device['udid']}")
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator found")
          PY
      - name: Build and test the app
        run: >-
          xcodebuild
          -project ios/CatalogueApp.xcodeproj
          -scheme CatalogueApp
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          build test
        working-directory: backend
