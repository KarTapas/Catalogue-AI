services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      FAKESTORE_BASE_URL: https://fakestoreapi.com
      FEATURED_IDS: "1,2,3,4,5"
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: catalogue@example.test
      SALES_INBOX: sales@example.test
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
