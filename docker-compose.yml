services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: catalogue@example.test
      SALES_INBOX: sales@example.test
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
